<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">GENESIS — ideas that keep their evidence</title>
  <desc id="desc">A visual journey from a spark through an idea field, evidence, physics, and a traceable build path.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b18"/>
      <stop offset="0.52" stop-color="#121a35"/>
      <stop offset="1" stop-color="#071d25"/>
    </linearGradient>
    <linearGradient id="line" x1="135" y1="0" x2="1145" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b"/>
      <stop offset="0.25" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="0.75" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="glowViolet">
      <stop stop-color="#7c3aed" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal">
      <stop stop-color="#14b8a6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="460" rx="30" fill="url(#background)"/>
  <circle cx="150" cy="70" r="210" fill="url(#glowViolet)"/>
  <circle cx="1110" cy="390" r="260" fill="url(#glowTeal)"/>
  <path d="M0 345 C210 270 315 430 520 348 C745 258 900 410 1280 300 L1280 460 L0 460 Z" fill="#0f172a" opacity="0.34"/>

  <g opacity="0.32" fill="#e2e8f0">
    <circle cx="90" cy="105" r="2"/>
    <circle cx="196" cy="44" r="1.5"/>
    <circle cx="1116" cy="76" r="2"/>
    <circle cx="1192" cy="144" r="1.4"/>
    <circle cx="1018" cy="34" r="1.2"/>
    <circle cx="65" cy="286" r="1.4"/>
    <circle cx="1225" cy="326" r="2"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="488" y="36" width="304" height="30" rx="15" fill="#111827" stroke="#334155"/>
    <text x="640" y="56" fill="#cbd5e1" font-size="13" font-weight="700">PUBLIC PRODUCT OVERVIEW</text>

    <text x="640" y="134" fill="#e0e7ff" font-size="70" font-weight="800">GENESIS</text>
    <text x="640" y="174" fill="#f8fafc" font-size="22" font-weight="650">IDEAS THAT KEEP THEIR EVIDENCE</text>
    <text x="640" y="208" fill="#94a3b8" font-size="17" font-weight="450">Expand boldly · ground claims · recompute physics · name the gaps</text>
  </g>

  <path d="M145 317 H1135" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M145 317 H1135" stroke="url(#line)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(145 317)">
      <circle r="38" fill="#24170a" stroke="#f59e0b" stroke-width="2"/>
      <path d="M0 -18 L5 -5 L18 0 L5 5 L0 18 L-5 5 L-18 0 L-5 -5 Z" fill="#fbbf24" filter="url(#softGlow)"/>
      <text y="67" fill="#f8fafc" font-size="14" font-weight="750">SPARK</text>
      <text y="89" fill="#94a3b8" font-size="12">human vision</text>
    </g>

    <g transform="translate(392 317)">
      <circle r="38" fill="#1c1536" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="-11" cy="-7" r="5" fill="#c4b5fd"/>
      <circle cx="12" cy="-10" r="4" fill="#8b5cf6"/>
      <circle cx="2" cy="12" r="6" fill="#ddd6fe"/>
      <path d="M-7 -4 L7 8 M7 -7 L4 6 M-8 -2 L-1 8" stroke="#a78bfa" stroke-width="2"/>
      <text y="67" fill="#f8fafc" font-size="14" font-weight="750">IDEA FIELD</text>
      <text y="89" fill="#94a3b8" font-size="12">options + trade-offs</text>
    </g>

    <g transform="translate(640 317)">
      <circle r="38" fill="#09261f" stroke="#34d399" stroke-width="2"/>
      <path d="M-14 -14 H10 L18 -6 V16 H-14 Z" fill="none" stroke="#6ee7b7" stroke-width="2.4"/>
      <path d="M9 -14 V-5 H18 M-7 -3 H10 M-7 5 H10 M-7 13 H4" stroke="#6ee7b7" stroke-width="2"/>
      <text y="67" fill="#f8fafc" font-size="14" font-weight="750">EVIDENCE</text>
      <text y="89" fill="#94a3b8" font-size="12">claims + receipts</text>
    </g>

    <g transform="translate(888 317)">
      <circle r="38" fill="#0a2133" stroke="#38bdf8" stroke-width="2"/>
      <path d="M-18 9 C-9 -18 7 -18 18 9" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
      <path d="M-18 9 H18 M0 -17 V16" stroke="#7dd3fc" stroke-width="2"/>
      <circle cy="9" r="4" fill="#bae6fd"/>
      <text y="67" fill="#f8fafc" font-size="14" font-weight="750">PHYSICS</text>
      <text y="89" fill="#94a3b8" font-size="12">bounded checks</text>
    </g>

    <g transform="translate(1135 317)">
      <circle r="38" fill="#31131b" stroke="#fb7185" stroke-width="2"/>
      <path d="M-18 13 V-5 L0 -17 L18 -5 V13 Z" fill="none" stroke="#fda4af" stroke-width="2.4"/>
      <path d="M-6 13 V1 H6 V13 M-18 -5 L0 6 L18 -5" fill="none" stroke="#fda4af" stroke-width="2"/>
      <text y="67" fill="#f8fafc" font-size="14" font-weight="750">BUILD PATH</text>
      <text y="89" fill="#94a3b8" font-size="12">package + next proof</text>
    </g>
  </g>

  <g fill="#64748b">
    <path d="M262 311 L274 317 L262 323 Z"/>
    <path d="M510 311 L522 317 L510 323 Z"/>
    <path d="M758 311 L770 317 L758 323 Z"/>
    <path d="M1005 311 L1017 317 L1005 323 Z"/>
  </g>
</svg>
