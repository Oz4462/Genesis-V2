<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">GENESIS capability system</title>
  <desc id="desc">Six connected capability areas surround the GENESIS core: ideation, research, assessment, CAD, exploration, and delivery. External prototyping and measurement remain outside the software boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b17"/>
      <stop offset="0.55" stop-color="#111a31"/>
      <stop offset="1" stop-color="#071d25"/>
    </linearGradient>
    <radialGradient id="coreGlow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="30" fill="url(#bg)"/>
  <circle cx="640" cy="356" r="190" fill="url(#coreGlow)"/>

  <g fill="#94a3b8">
    <circle cx="92" cy="70" r="2"/>
    <circle cx="1168" cy="82" r="2"/>
    <circle cx="1210" cy="310" r="1.5"/>
    <circle cx="76" cy="410" r="1.5"/>
    <circle cx="1050" cy="640" r="2"/>
    <circle cx="208" cy="630" r="2"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="640" y="48" fill="#f8fafc" font-size="28" font-weight="800">GENESIS CAPABILITY SYSTEM</text>
    <text x="640" y="75" fill="#94a3b8" font-size="14">Measured software surfaces · August 2026 snapshot</text>
  </g>

  <g stroke="#475569" stroke-width="2.5" fill="none">
    <path d="M378 207 C470 235 520 272 570 316"/>
    <path d="M640 225 V270"/>
    <path d="M902 207 C810 235 760 272 710 316"/>
    <path d="M378 509 C470 480 520 440 570 397"/>
    <path d="M640 486 V442"/>
    <path d="M902 509 C810 480 760 440 710 397"/>
  </g>

