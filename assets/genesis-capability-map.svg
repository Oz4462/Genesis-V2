    <path d="M560 307 L574 320 L555 320 Z"/>
    <path d="M633 260 L640 275 L647 260 Z"/>
    <path d="M720 307 L706 320 L725 320 Z"/>
    <path d="M560 406 L574 393 L555 393 Z"/>
    <path d="M633 452 L640 437 L647 452 Z"/>
    <path d="M720 406 L706 393 L725 393 Z"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g>
      <rect x="70" y="125" width="310" height="144" rx="22" fill="#111827" stroke="#34d399" stroke-width="2"/>
      <circle cx="112" cy="169" r="22" fill="#07352b" stroke="#34d399"/>
      <path d="M112 153 L116 165 L128 169 L116 173 L112 185 L108 173 L96 169 L108 165 Z" fill="#6ee7b7"/>
      <text x="148" y="159" fill="#d1fae5" font-size="12" font-weight="750">01 · IDEATE</text>
      <text x="148" y="184" fill="#f8fafc" font-size="20" font-weight="750">Idea machine</text>
      <text x="96" y="218" fill="#a7f3d0" font-size="15" font-weight="700">10 lenses · 12 stretch tactics</text>
      <text x="96" y="244" fill="#94a3b8" font-size="13">offline expansion · history · remix</text>
    </g>

    <g>
      <rect x="485" y="92" width="310" height="144" rx="22" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="527" cy="136" r="22" fill="#083344" stroke="#22d3ee"/>
      <path d="M516 124 H535 L541 130 V149 H516 Z M534 124 V131 H541 M521 137 H536 M521 143 H532" fill="none" stroke="#67e8f9" stroke-width="2"/>
      <text x="563" y="126" fill="#cffafe" font-size="12" font-weight="750">02 · GROUND</text>
      <text x="563" y="151" fill="#f8fafc" font-size="20" font-weight="750">Research and ledger</text>
      <text x="511" y="185" fill="#a5f3fc" font-size="15" font-weight="700">claims · receipts · checkpoints</text>
      <text x="511" y="211" fill="#94a3b8" font-size="13">provenance · revision · abstention</text>
    </g>

    <g>
      <rect x="900" y="125" width="310" height="144" rx="22" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="942" cy="169" r="22" fill="#082f49" stroke="#38bdf8"/>
      <path d="M929 177 C936 151 949 151 956 177 M929 177 H956 M943 153 V183" fill="none" stroke="#7dd3fc" stroke-width="2.3"/>
