      <text x="978" y="184" fill="#f8fafc" font-size="20" font-weight="750">Physics and constraints</text>
      <text x="926" y="218" fill="#bae6fd" font-size="15" font-weight="700">53 validators · 58 recipes</text>
      <text x="926" y="244" fill="#94a3b8" font-size="13">units · SMT · requirement gates</text>
    </g>

    <g>
      <rect x="70" y="446" width="310" height="144" rx="22" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="112" cy="490" r="22" fill="#3a2506" stroke="#f59e0b"/>
      <path d="M99 486 L112 478 L125 486 V502 L112 510 L99 502 Z M99 486 L112 494 L125 486 M112 494 V510" fill="none" stroke="#fbbf24" stroke-width="2"/>
