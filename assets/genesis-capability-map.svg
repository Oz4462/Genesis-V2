      <text x="148" y="505" fill="#f8fafc" font-size="20" font-weight="750">CAD and manufacturing</text>
      <text x="96" y="539" fill="#fde68a" font-size="15" font-weight="700">27 shape families · isolated OCCT</text>
      <text x="96" y="565" fill="#94a3b8" font-size="13">STEP · BREP · STL · DFM · packages</text>
    </g>

    <g>
      <rect x="485" y="479" width="310" height="144" rx="22" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="527" cy="523" r="22" fill="#251647" stroke="#a78bfa"/>
