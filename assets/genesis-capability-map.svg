      <path d="M527 501 V507 M527 539 V545 M505 523 H511 M543 523 H549 M512 508 L516 512 M538 534 L542 538 M542 508 L538 512 M516 534 L512 538" stroke="#c4b5fd" stroke-width="2"/>
      <text x="563" y="513" fill="#ede9fe" font-size="12" font-weight="750">05 · EXPLORE</text>
      <text x="563" y="538" fill="#f8fafc" font-size="20" font-weight="750">Simulation and domains</text>
      <text x="511" y="572" fill="#ddd6fe" font-size="15" font-weight="700">discovery · humanoids · aero</text>
      <text x="511" y="598" fill="#94a3b8" font-size="13">case-bound research surfaces</text>
    </g>

    <g>
      <rect x="900" y="446" width="310" height="144" rx="22" fill="#111827" stroke="#fb7185" stroke-width="2"/>
      <circle cx="942" cy="490" r="22" fill="#3b121d" stroke="#fb7185"/>
      <path d="M928 479 H956 V502 H928 Z M933 485 H951 M933 491 H951 M933 497 H945" fill="none" stroke="#fda4af" stroke-width="2"/>
      <text x="978" y="480" fill="#ffe4e6" font-size="12" font-weight="750">06 · DELIVER</text>
      <text x="978" y="505" fill="#f8fafc" font-size="20" font-weight="750">Interfaces and packages</text>
      <text x="926" y="539" fill="#fecdd3" font-size="15" font-weight="700">62 CLI modes · 25 API routes</text>
      <text x="926" y="565" fill="#94a3b8" font-size="13">CLI · local web · Python API</text>
    </g>
  </g>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <circle cx="640" cy="356" r="92" fill="url(#core)" stroke="#c4b5fd" stroke-width="3"/>
    <text x="640" y="345" fill="#ffffff" font-size="29" font-weight="850">GENESIS</text>
    <text x="640" y="372" fill="#e0f2fe" font-size="13" font-weight="700">IDEA → EVIDENCE → BUILD</text>
    <text x="640" y="397" fill="#dbeafe" font-size="12">383 modules · 0 code islands</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="230" y="653" width="820" height="42" rx="21" fill="#25131a" stroke="#fb7185"/>
    <text x="640" y="679" fill="#ffe4e6" font-size="14" font-weight="700">EXTERNAL REALITY BOUNDARY · prototype · measurement · independent review · certification</text>
  </g>
</svg>
